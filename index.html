<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>Eastar Jet 飛機動態追蹤</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f6f8; margin: 20px; color: #333; }
    .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    
    /* 頂部 Tab 樣式 */
    .tabs { display: flex; gap: 8px; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 15px; }
    .tab-btn { padding: 8px 16px; border: none; background: #e0e0e0; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .tab-btn.active { background: #007bff; color: #fff; }
    
    /* 工具列 (篩選) */
    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .search-input { padding: 8px 12px; width: 220px; border: 1px solid #ccc; border-radius: 4px; }
    .update-time { font-size: 12px; color: #777; }
    
    /* 表格樣式 (比照原圖 5 欄) */
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 10px; border-bottom: 1px solid #eee; font-size: 14px; }
    th { background: #fafafa; color: #666; font-weight: 600; }
    tr:hover { background: #f9f9f9; }
  </style>
</head>
<body>

<div class="container">
  <!-- Tab 切換列 -->
  <div class="tabs" id="tabBar">
    <button class="tab-btn active" onclick="switchTab('HL8717')">HL8717 (彩繪機)</button>
    <button class="tab-btn" onclick="switchTab('HL8599')">HL8599</button>
    <button class="tab-btn" onclick="switchTab('HL8759')">HL8759</button>
    <button class="tab-btn" onclick="switchTab('HL8543')">HL8543</button>
    <button class="tab-btn" onclick="switchTab('HL8544')">HL8544</button>
  </div>

  <!-- 工具列 -->
  <div class="toolbar">
    <input type="text" id="searchInput" class="search-input" placeholder="🔍 搜尋城市 (如 ICN, NRT, Taipei)..." onkeyup="filterCity()">
    <span class="update-time" id="updateTime">最後更新時間：載入中...</span>
  </div>

  <!-- 資料表格 -->
  <table>
    <thead>
      <tr>
        <th>DATE</th>
        <th>FROM</th>
        <th>TO</th>
        <th>FLIGHT</th>
        <th>FLIGHT TIME</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<script>
  let rawData = {};
  let currentAircraft = 'HL8717';

  // 1. 初始化讀取 JSON 資料
  fetch('data.json')
    .then(res => res.json())
    .then(data => {
      rawData = data;
      document.getElementById('updateTime').innerText = `最後更新時間：${data.last_updated || '未知'}`;
      renderTable();
    })
    .catch(err => console.error("資料讀取失敗:", err));

  // 2. 切換 Tab
  function switchTab(aircraft) {
    currentAircraft = aircraft;
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.classList.toggle('active', btn.innerText.includes(aircraft));
    });
    renderTable();
  }

  // 3. 渲染表格
  function renderTable() {
    const list = rawData[currentAircraft] || [];
    const filterText = document.getElementById('searchInput').value.toLowerCase();
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';

    list.forEach(item => {
      const matchFrom = item.from.toLowerCase().includes(filterText);
      const matchTo = item.to.toLowerCase().includes(filterText);

      if (matchFrom || matchTo) {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${item.date}</td>
          <td>${item.from}</td>
          <td>${item.to}</td>
          <td>${item.flight}</td>
          <td>${item.flight_time}</td>
        `;
        tbody.appendChild(tr);
      }
    });
  }

  // 4. 城市動態過濾
  function filterCity() {
    renderTable();
  }
</script>

</body>
</html>
