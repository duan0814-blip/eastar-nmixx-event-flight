<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eastar Jet NMIXX 彩繪機航班追蹤器</title>
    <style>
        :root {
            --primary-red: #e52521;
            --border-color: #e2e8f0;
            --text-dark: #2d3748;
            --bg-light: #f8fafc;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px 10px;
            color: var(--text-dark);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        /* 頂部 Banner 照片（高度為原圖的 2/3，置中裁切） */
        .banner-container {
            position: relative;
            width: 100%;
            aspect-ratio: 755 / 234;   /* 原圖 755x351，高度減 1/3 → 234 */
            overflow: hidden;
            background-color: #8f9fd0;
        }

        .banner-container img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center center;
            display: block;
        }

        /* 活動日期看板 */
        .events-title {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin: 0 0 10px;
            font-size: 15px;
            font-weight: 700;
        }

        .events-title a {
            font-size: 13px;
            font-weight: 500;
            color: #2563eb;
            text-decoration: none;
        }

        .events-title a:hover {
            text-decoration: underline;
        }

        .events-board {
            display: grid;
            grid-auto-flow: column;
            grid-auto-columns: minmax(0, 1fr);  /* 幾個活動就平均分幾欄 */
            gap: 10px;
            margin-bottom: 20px;
        }

        .event-card {
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            background: var(--bg-light);
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .event-card.ongoing {
            border-color: #fecaca;
            background: #fff5f5;
            box-shadow: 0 0 0 1px #fecaca;
        }

        .event-card.ended {
            opacity: .55;
        }

        .event-card.ended .event-img img {
            filter: grayscale(1);
        }

        /* 活動圖片：固定 16:9、每張一樣高，置中裁切 */
        .event-img {
            position: relative;
            aspect-ratio: 16 / 9;
            min-height: 0;
            flex-shrink: 0;
            overflow: hidden;
            background: #e2e8f0;
        }

        .event-img img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
        }

        .event-body {
            padding: 7px 10px 8px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            flex: 1;
        }

        /* 狀態標籤疊在圖片左上角 */
        .event-status {
            position: absolute;
            top: 6px;
            left: 6px;
            font-size: 10px;
            font-weight: 700;
            padding: 1px 7px;
            border-radius: 999px;
            background: rgba(255,255,255,.92);
            color: #4a5568;
            box-shadow: 0 1px 3px rgba(0,0,0,.2);
        }

        .ongoing .event-status {
            background: var(--primary-red);
            color: #fff;
        }

        .upcoming .event-status {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .event-name {
            font-size: 13px;
            font-weight: 700;
            line-height: 1.3;
        }

        .event-note {
            font-size: 11px;
            color: #718096;
            line-height: 1.3;
        }

        .event-date {
            font-size: 14px;
            font-weight: 800;
            letter-spacing: .2px;
            color: #1a202c;
            line-height: 1.3;
        }

        .event-tag {
            display: inline-block;
            margin-left: 4px;
            padding: 0 5px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 700;
            vertical-align: 2px;
            background: #fef3c7;
            color: #92400e;
        }

        .event-countdown {
            margin-top: auto;
            padding-top: 2px;
            font-size: 11px;
            color: #718096;
        }

        .ongoing .event-countdown {
            color: var(--primary-red);
            font-weight: 600;
        }

        /* Tab 按鈕樣式 */
        .tabs-container {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .tab-btn {
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
            /* 預設（未選取）：白色背景、灰框、黑字 */
            background-color: #ffffff;
            color: #4a5568;
            border: 1px solid #cbd5e0;
        }

        .tab-btn:hover {
            background-color: #f7fafc;
            border-color: #a0aec0;
        }

        /* 被選取狀態：紅色背景、紅白框、白字 */
        .tab-btn.active {
            background-color: var(--primary-red);
            color: #ffffff;
            border-color: var(--primary-red);
            box-shadow: 0 2px 6px rgba(229, 37, 33, 0.3);
        }

        /* 搜尋與更新時間控制列 */
        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 200px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 12px 10px 36px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }

        .search-box input:focus {
            border-color: var(--primary-red);
        }

        .search-box::before {
            content: "🔍";
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
            opacity: 0.5;
        }

        .last-updated {
            font-size: 13px;
            color: #718096;
        }

        /* 資料表格 */
        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            text-align: left;
        }

        th {
            background-color: #f8fafc;
            color: #4a5568;
            padding: 12px 16px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 0.5px;
            border-bottom: 2px solid var(--border-color);
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
        }

        tr:nth-child(even) {
            background-color: #fbfcfd;
        }

        tr:hover {
            background-color: #f1f5f9;
        }

        .no-data {
            text-align: center;
            padding: 30px;
            color: #a0aec0;
        }
        /* 內容區塊內距 */
        .content-area {
            padding: 24px;
        }

        /* ===== 手機版 RWD ===== */
        @media (max-width: 640px) {
            body {
                padding: 0;
            }

            .container {
                border-radius: 0;
                box-shadow: none;
            }

            .content-area {
                padding: 16px;
            }

            /* 活動看板改為橫向滑動（約露出 2.3 張，提示可往右滑） */
            .events-board {
                grid-auto-columns: 42%;
                gap: 8px;
                overflow-x: auto;
                scroll-snap-type: x mandatory;
                margin-left: -16px;
                margin-right: -16px;
                padding: 0 16px 4px;
                scroll-padding-left: 16px;
                scrollbar-width: none;
                -webkit-overflow-scrolling: touch;
            }

            .events-board::-webkit-scrollbar {
                display: none;
            }

            .event-card {
                scroll-snap-align: start;
            }

            .event-body {
                padding: 6px 8px 7px;
                gap: 1px;
            }

            .event-name {
                font-size: 12px;
            }

            .event-note {
                font-size: 10px;
            }

            .event-date {
                font-size: 13px;
            }

            .event-tag {
                font-size: 9px;
                padding: 0 4px;
            }

            .event-countdown {
                font-size: 10px;
            }

            .event-status {
                top: 5px;
                left: 5px;
                font-size: 9px;
                padding: 1px 6px;
            }

            /* Tab 可左右滑動，避免擠壓 */
            .tabs-container {
                margin-left: -16px;
                margin-right: -16px;
                padding-left: 16px;
                padding-right: 16px;
                -webkit-overflow-scrolling: touch;
                scrollbar-width: none;
            }

            .tabs-container::-webkit-scrollbar {
                display: none;
            }

            .tab-btn {
                padding: 10px 14px;
            }

            /* 搜尋框與更新時間改為上下排列 */
            .controls-row {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }

            .search-box {
                min-width: 0;
            }

            .search-box input {
                font-size: 16px; /* 避免 iOS 聚焦時自動放大 */
            }

            /* 表格改為卡片式 */
            .table-container {
                overflow-x: visible;
            }

            table thead {
                display: none;
            }

            table, tbody, tr, td {
                display: block;
                width: 100%;
                box-sizing: border-box;
            }

            tbody tr {
                background: #ffffff;
                border: 1px solid var(--border-color);
                border-radius: 10px;
                margin-bottom: 12px;
                padding: 6px 14px;
            }

            tr:nth-child(even),
            tr:hover {
                background-color: #ffffff;
            }

            td {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 12px;
                padding: 8px 0;
                border-bottom: 1px dashed var(--border-color);
                text-align: right;
            }

            td:last-child {
                border-bottom: none;
            }

            td::before {
                content: attr(data-label);
                font-size: 12px;
                font-weight: 600;
                color: #718096;
                letter-spacing: 0.5px;
                text-align: left;
                flex-shrink: 0;
            }

            td.no-data {
                display: block;
                text-align: center;
                border-bottom: none;
            }

            td.no-data::before {
                content: none;
            }

            tbody tr:has(td.no-data) {
                border: none;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Banner 照片 -->
    <div class="banner-container">
        <img src="banner.png" alt="Eastar Jet NMIXX Banner">
    </div>

    <div class="content-area">
        <!-- 活動日期看板 -->
        <div class="events-title">
            <span>📅 活動日期</span>
            <a href="https://www.eastarjet.com/newstar/PGWTA00002?eventNo=2650&gubun=I&searchIndex=1" target="_blank" rel="noopener noreferrer">活動詳情 ↗</a>
        </div>
        <div class="events-board" id="eventsBoard">
            <!-- 由 JavaScript 自動產生 -->
        </div>

        <!-- 飛機編號 Tab 分頁 -->
        <div class="tabs-container" id="tabsContainer">
            <!-- 由 JavaScript 自動產生 -->
        </div>

        <!-- 搜尋列與最後更新時間 -->
        <div class="controls-row">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="搜尋城市 (如 ICN, NRT, Taipei)..." oninput="filterData()">
            </div>
            <div class="last-updated" id="lastUpdated">
                最後更新時間：載入中...
            </div>
        </div>

        <!-- 表格區域 -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>DATE</th>
                        <th>FROM</th>
                        <th>TO</th>
                        <th>FLIGHT</th>
                        <th>FLIGHT TIME</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="5" class="no-data">資料讀取中...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // 活動資料：之後要新增/修改活動只要改這裡（顯示順序 = 這裡的順序）
    // start / end 格式：YYYY-MM-DD（台灣時間，用來判斷狀態與倒數）
    // endLabel：結束日想顯示成文字時填（例如「11月底」）；tag：日期後的小標籤；note：小字備註；img：活動圖片
    const EVENTS = [
        { name: "彩繪機", img: "event1.png", start: "2026-11-11", end: "2027-04-30", tag: "預計" },
        { name: "特別版實體登機證", img: "event2.png", note: "韓國 → 海外（大邱不提供）",
          start: "2026-10-02", end: "2026-11-30", endLabel: "11月底", tag: "限量" },
        { name: "隨機成員電子登機證", img: "event3.png", note: "海外 → 韓國", start: "2026-10-02", end: "2026-12-31" },
        { name: "特別座椅頭枕套", img: "event4.png", start: "2026-10-02", end: "2027-02-28" },
        { name: "登機/下機音樂", img: "event5.png", start: "2026-10-20", end: "2026-12-31" }
    ];

    // 渲染活動日期看板（依台灣日期自動判斷 進行中 / 即將開始 / 已結束）
    function renderEvents() {
        const DAY = 86400000;
        const today = new Date(new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Taipei' }));
        const pad = n => String(n).padStart(2, '0');
        // 跟今年同年只顯示月.日，跨年才加年份
        const fmt = d => (d.getUTCFullYear() !== today.getUTCFullYear() ? d.getUTCFullYear() + '.' : '')
                         + `${pad(d.getUTCMonth() + 1)}.${pad(d.getUTCDate())}`;

        document.getElementById('eventsBoard').innerHTML = EVENTS.map(ev => {
            const s = new Date(ev.start), e = new Date(ev.end);
            let cls, status, countdown;
            if (today < s) {
                cls = 'upcoming'; status = '即將開始';
                countdown = `${Math.round((s - today) / DAY)} 天後開始`;
            } else if (today > e) {
                cls = 'ended'; status = '已結束'; countdown = '活動已結束';
            } else {
                const left = Math.round((e - today) / DAY);
                cls = 'ongoing'; status = '進行中';
                countdown = left === 0 ? '今天最後一天！' : `剩餘 ${left} 天`;
            }
            const date = (ev.start === ev.end ? fmt(s) : `${fmt(s)} ~ ${ev.endLabel || fmt(e)}`)
                       + (ev.tag ? `<span class="event-tag">${ev.tag}</span>` : '');
            return `<div class="event-card ${cls}">
                        <div class="event-img">
                            <img src="${ev.img}" alt="${ev.name}" loading="lazy">
                            <span class="event-status">${status}</span>
                        </div>
                        <div class="event-body">
                            <div class="event-name">${ev.name}</div>
                            ${ev.note ? `<div class="event-note">${ev.note}</div>` : ''}
                            <div class="event-date">${date}</div>
                            <div class="event-countdown">${countdown}</div>
                        </div>
                    </div>`;
        }).join('');
    }

    let flightData = {};
    let currentAircraft = '';

    // 飛機編號顯示名稱對照
    const aircraftLabels = {
        "HL8717": "HL8717 (彩繪機)",
        "HL8599": "HL8599",
        "HL8759": "HL8759",
        "HL8543": "HL8543",
        "HL8544": "HL8544"
    };

    // 載入 JSON 資料
    async function loadFlightData() {
        try {
            const response = await fetch('data.json?t=' + new Date().getTime());
            flightData = await response.json();

            // 更新時間
            if (flightData.last_updated) {
                document.getElementById('lastUpdated').textContent = `最後更新時間：${flightData.last_updated}`;
            }

            // 初始化 Tabs
            initTabs();
        } catch (error) {
            console.error('Error loading JSON:', error);
            document.getElementById('tableBody').innerHTML = `<tr><td colspan="5" class="no-data">無法載入資料，請確認 data.json 是否存在。</td></tr>`;
        }
    }

    // 初始化 Tab 按鈕
    function initTabs() {
        const tabsContainer = document.getElementById('tabsContainer');
        tabsContainer.innerHTML = '';

        // 取得所有飛機編號 (排除 last_updated)
        const aircraftList = Object.keys(flightData).filter(key => key !== 'last_updated');

        if (aircraftList.length === 0) return;

        // 預設選取第一個飛機編號
        currentAircraft = aircraftList[0];

        aircraftList.forEach(code => {
            const btn = document.createElement('button');
            btn.className = `tab-btn ${code === currentAircraft ? 'active' : ''}`;
            btn.textContent = aircraftLabels[code] || code;
            btn.onclick = () => switchTab(code);
            tabsContainer.appendChild(btn);
        });

        renderTable();
    }

    // 切換 Tab
    function switchTab(aircraftCode) {
        currentAircraft = aircraftCode;

        // 更新按鈕 active 狀態
        document.querySelectorAll('.tab-btn').forEach(btn => {
            const label = aircraftLabels[aircraftCode] || aircraftCode;
            if (btn.textContent === label) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });

        // 清空搜尋框並重新渲染
        document.getElementById('searchInput').value = '';
        renderTable();
    }

    // 渲染表格資料
    function renderTable() {
        const tableBody = document.getElementById('tableBody');
        const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();

        const list = flightData[currentAircraft] || [];

        // 搜尋過濾
        const filteredList = list.filter(item => {
            return (
                item.date.toLowerCase().includes(searchTerm) ||
                item.from.toLowerCase().includes(searchTerm) ||
                item.to.toLowerCase().includes(searchTerm) ||
                item.flight.toLowerCase().includes(searchTerm)
            );
        });

        if (filteredList.length === 0) {
            tableBody.innerHTML = `<tr><td colspan="5" class="no-data">沒有找到相關航班紀錄</td></tr>`;
            return;
        }

        tableBody.innerHTML = filteredList.map(item => `
            <tr>
                <td data-label="DATE">${item.date}</td>
                <td data-label="FROM">${item.from}</td>
                <td data-label="TO">${item.to}</td>
                <td data-label="FLIGHT"><strong>${item.flight}</strong></td>
                <td data-label="FLIGHT TIME">${item.flight_time}</td>
            </tr>
        `).join('');
    }

    // 搜尋過濾事件處理
    function filterData() {
        renderTable();
    }

    // 頁面載入時執行
    renderEvents();
    window.onload = loadFlightData;
</script>

</body>
</html>
