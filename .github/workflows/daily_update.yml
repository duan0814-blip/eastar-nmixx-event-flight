name: Hourly Flight Data Sync

on:
  # 主要觸發：由外部排程（cron-job.org）每小時第 7 分呼叫 workflow_dispatch API
  # GitHub 內建 schedule 在免費帳號常被延遲/丟棄（實測 4~9 小時才跑一次），僅留作備援
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:     # 外部排程與手動按鈕都走這裡

concurrency:            # 避免上一輪還沒跑完就重疊執行
  group: flight-data-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 檢出專案碼
        uses: actions/checkout@v5

      - name: 設定 Python 環境
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 安裝依賴套件
        run: pip install cloudscraper beautifulsoup4

      - name: 執行資料抓取
        run: python fetch_data.py

      - name: 自動提交並推送更新至 GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Auto-update flight data" || exit 0
          git pull --rebase origin main
          git push
